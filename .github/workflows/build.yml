name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk WhatToWatch.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WhatToWatch.apk \
            --title "What To Watch (build ${{ github.run_number }})" \
            --notes "Install on your TV box with Downloader using this link: https://github.com/${{ github.repository }}/releases/latest/download/WhatToWatch.apk"
